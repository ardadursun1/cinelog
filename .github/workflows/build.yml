name: Build Desktop Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            artifact_name: cinelog-windows
            artifact_path: build/windows/x64/runner/Release
          - os: macos-latest
            target: macos
            artifact_name: cinelog-macos
            artifact_path: build/macos/Build/Products/Release/movie_tracker.app
          - os: ubuntu-latest
            target: linux
            artifact_name: cinelog-linux
            artifact_path: build/linux/x64/release/bundle

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libsqlite3-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install pub dependencies
        run: flutter pub get

      - name: Build ${{ matrix.target }} release
        run: flutter build ${{ matrix.target }} --release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
